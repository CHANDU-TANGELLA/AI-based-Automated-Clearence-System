<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">   
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Upload Document - AI Clearance</title>  
    
    <link rel="stylesheet" href="../static/css/bootstrap.min.css">
    <link rel="stylesheet" href="../static/style.css">
    <link rel="stylesheet" href="../static/css/custom.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="host_version"> 

    <header class="top-navbar">
		<nav class="navbar navbar-expand-lg navbar-light bg-light">
			<div class="container-fluid">
				<a class="navbar-brand p-0" href="/">
					<h1 class="text-white" style="font-size: xx-large;" ><i class="fa fa-certificate fa-1x me-2"></i> AI<span style="color: #eea412;">Clearance</span></h1>
				</a>
                <div class="collapse navbar-collapse" id="navbars-host">
					<ul class="navbar-nav ml-auto">
						<li class="nav-item"><a class="nav-link" href="/StudentScreen.html"><i class="fa fa-arrow-left"></i> Back to Dashboard</a></li>
					</ul>					
				</div>
			</div>
		</nav>
	</header>
	
    <div class="dashboard-container" style="padding: 40px;">
        <div class="row">
            <div class="col-md-6 offset-md-3">
                <div class="card shadow" style="border: none; border-radius: 10px; overflow: hidden;">
                    <div class="card-header text-white" style="background-color: #eea412; padding: 15px;">
                        <h3 class="card-title mb-0" style="margin: 0;"><i class="fa fa-robot"></i> AI Document Verification</h3>
                    </div>
                    <div class="card-body" style="padding: 30px; background: #fff;">
                        <div class="alert alert-info">
                            <strong><i class="fa fa-info-circle"></i> Info:</strong> Upload a PDF receipt or form. Our AI will analyze it to verify your clearance.
                        </div>
                        
                        <form action="/UploadDocument" method="post" enctype="multipart/form-data">
                            {% csrf_token %}
                            
                            <div class="form-group mb-3">
                                <label style="font-weight: bold;">Student ID</label>
                                <input type="text" name="student_id" class="form-control" value="{{ student_id }}" readonly style="background-color: #f8f9fa;">
                            </div>

                            <div class="form-group mb-3">
                                <label style="font-weight: bold;">Department</label>
                                <select name="department" class="form-control" required style="height: 45px;">
                                    <option value="Accounts">Accounts (Tuition Fee)</option>
                                    <option value="Library">Library</option>
                                    <option value="Hostel">Hostel</option>
                                </select>
                            </div>

                            <div class="form-group mb-4">
                                <label style="font-weight: bold;">Upload Document (PDF)</label>
                                <input type="file" name="document" class="form-control" accept=".pdf" required style="padding: 10px;">
                            </div>

                            <button type="submit" class="btn btn-primary w-100" style="background-color: #1a237e; border: none; padding: 12px;">
                                <i class="fa fa-upload"></i> Analyze & Submit
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../static/js/all.js"></script>
    <script src="../static/js/custom.js"></script>
</body>
</html>
