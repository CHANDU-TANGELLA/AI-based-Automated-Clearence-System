<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Basic -->
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">   
   
    <!-- Mobile Metas -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
 
     <!-- Site Metas -->
    <title>Accept Fee - AI-Based Automated Clearance System</title>  
    <meta name="keywords" content="">
    <meta name="description" content="">
    <meta name="author" content="">

    <!-- Icon Font Stylesheet -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>

    <!-- Site Icons -->
    <link rel="shortcut icon" href="../static/images/favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="../static/images/apple-touch-icon.png">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="../static/css/bootstrap.min.css">
    <!-- Site CSS -->
    <link rel="stylesheet" href="../static/style.css">
    <!-- ALL VERSION CSS -->
    <link rel="stylesheet" href="../static/css/versions.css">
    <!-- Responsive CSS -->
    <link rel="stylesheet" href="../static/css/responsive.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../static/css/custom.css?v=2.2">

    <!-- Modernizer for Portfolio -->
    <script src="../static/js/modernizer.js"></script>

    <!--[if lt IE 9]>
      <script src="https://oss.maxcdn.com/libs/html5shiv/3.7.0/html5shiv.js"></script>
      <script src="https://oss.maxcdn.com/libs/respond.js/1.4.2/respond.min.js"></script>
    <![endif]-->
</head>
<body class="host_version form-page"> 

    <!-- LOADER -->
	<div id="preloader">
		<div class="loader-container">
			<div class="progress-br float shadow">
				<div class="progress__item"></div>
			</div>
		</div>
	</div>
	<!-- END LOADER -->	
	
	<!-- Start header -->
	<header class="top-navbar">
		<nav class="navbar navbar-expand-lg navbar-light bg-light">
			<div class="container-fluid">
				<a class="navbar-brand p-0" href="/">
					<h1 class="text-white" style="font-size: xx-large;" ><i class="fa fa-certificate fa-1x me-2"></i> AI<span style="color: #eea412;">Clearance</span></h1>
				</a>                                  
				<button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbars-host" aria-controls="navbars-rs-food" aria-expanded="false" aria-label="Toggle navigation">
					<span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
				</button>
				<div class="collapse navbar-collapse" id="navbars-host">
					<ul class="navbar-nav ml-auto">
						<li class="nav-item"><a class="nav-link" href="/EmployeeScreen.html">Back to Dashboard</a></li>
						<li class="nav-item"><a class="nav-link" href="/">Logout</a></li>						
					</ul>					
				</div>
			</div>
		</nav>
	</header>
	<!-- End header -->
	
	<div class="form-container">
        <h2><i class="fa fa-money-bill-wave"></i> Accept Fee Payment</h2>
        
        {% if data %}
        <div class="status-message {% if 'accepted' in data|lower or 'success' in data|lower %}success{% else %}error{% endif %}">
            {{ data|safe }}
        </div>
        {% endif %}

        <form action="/AcceptFeeAction" method="POST">
            {% csrf_token %}
            <div class="form-grid">
                <div class="form-group">
                    <label for="t1"><i class="fa fa-user-graduate"></i> Student ID</label>
                    <select name="t1" id="t1" class="student-select" required>
                        <option value="">-- Select Student ID --</option>
                        {% for student_id in students %}
                        <option value="{{ student_id }}">{{ student_id }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="t2"><i class="fa fa-money-bill-wave"></i> {% if fee_label %}{{ fee_label }}{% else %}Fee Amount{% endif %}</label>
                    <input type="number" name="t2" id="t2" placeholder="Enter fee amount" step="0.01" min="0" required>
                </div>
                <div class="form-group">
                    <label for="t3"><i class="fa fa-calendar"></i> Course Year</label>
                    <input type="text" name="t3" id="t3" placeholder="Enter course year" required>
                </div>
            </div>
            <button type="submit" class="form-submit-btn">
                <i class="fa fa-check-circle"></i> Accept Fee
            </button>
        </form>
    </div>

    <div class="copyrights">
        <div class="container">
            <div class="footer-distributed">
                <div class="footer-center">                   
                    <p class="footer-company-name">All Rights Reserved. © 2018 SmartEDU Design By : html design, Modified By: "Your Name"</p>
                </div>
            </div>
        </div>
    </div>

    <a href="#" id="scroll-to-top" class="dmtop global-radius"><i class="fa fa-angle-up"></i></a>

    <!-- ALL JS FILES -->
    <script src="../static/js/all.js"></script>
    <!-- ALL PLUGINS -->
    <script src="../static/js/custom.js"></script>
	<script src="../static/js/timeline.min.js"></script>
</body>
</html>
