	<div class="qr-scanner-container">
        <h2 style="text-align: center; margin-bottom: 20px;">
            <i class="fa fa-qrcode"></i> Scan QR Code to Download Certificate
        </h2>
        
        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>
        
        <div id="reader"></div>
        
        <div class="scanner-controls">
            <button class="btn-scan" id="startScanBtn" onclick="startScan()">
                <i class="fa fa-camera"></i> Start Camera
            </button>
            <button class="btn-scan" id="stopScanBtn" onclick="stopScan()" disabled>
                <i class="fa fa-stop"></i> Stop Camera
            </button>
        </div>
        
        <div class="certificate-display" id="certificateDisplay">
            <div class="certificate-info">
                <h3><i class="fa fa-certificate"></i> Certificate Information</h3>
                <div id="certificateDetails"></div>
            </div>
            <div style="text-align: center;">
                <a href="#" id="downloadBtn" class="download-certificate-btn" style="display: none;">
                    <i class="fa fa-download"></i> Download Certificate
                </a>
            </div>
        </div>
    </div>


    <!-- ALL JS FILES -->
    <script src="../static/js/all.js"></script>
    <!-- ALL PLUGINS -->
    <script src="../static/js/custom.js"></script>
	<script src="../static/js/timeline.min.js"></script>
	
	<script>
        let html5QrcodeScanner = null;
        let scannedData = null;
        
        function startScan() {
            const startBtn = document.getElementById('startScanBtn');
            const stopBtn = document.getElementById('stopScanBtn');
            const errorMsg = document.getElementById('errorMessage');
            const successMsg = document.getElementById('successMessage');
            
            errorMsg.classList.remove('show');
            successMsg.classList.remove('show');
            
            html5QrcodeScanner = new Html5Qrcode("reader");
            
            html5QrcodeScanner.start(
                { facingMode: "environment" },
                {
                    fps: 10,
                    qrbox: { width: 250, height: 250 }
                },
                (decodedText, decodedResult) => {
                    // Successfully scanned
                    stopScan();
                    scannedData = decodedText;
                    verifyAndDisplayCertificate(decodedText);
                },
                (errorMessage) => {
                    // Error ignored for continuous scanning
                }
            ).then(() => {
                startBtn.disabled = true;
                stopBtn.disabled = false;
            }).catch((err) => {
                errorMsg.textContent = 'Error starting camera: ' + err;
                errorMsg.classList.add('show');
            });
        }
        
        function stopScan() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    html5QrcodeScanner.clear();
                    document.getElementById('startScanBtn').disabled = false;
                    document.getElementById('stopScanBtn').disabled = true;
                }).catch((err) => {
                    console.error('Error stopping scanner:', err);
                });
            }
        }
        
        function verifyAndDisplayCertificate(qrData) {
            const errorMsg = document.getElementById('errorMessage');
            const successMsg = document.getElementById('successMessage');
            const certDisplay = document.getElementById('certificateDisplay');
            const certDetails = document.getElementById('certificateDetails');
            const downloadBtn = document.getElementById('downloadBtn');
            
            errorMsg.classList.remove('show');
            successMsg.classList.remove('show');
            
            // Parse QR code data
            const lines = qrData.split('\n');
            let studentId = '';
            let year = '';
            let certNo = '';
            let date = '';
            let status = '';
            
            lines.forEach(line => {
                if (line.startsWith('Student ID:')) {
                    studentId = line.replace('Student ID:', '').trim();
                } else if (line.startsWith('Year:')) {
                    year = line.replace('Year:', '').trim();
                } else if (line.startsWith('Certificate No:')) {
                    certNo = line.replace('Certificate No:', '').trim();
                } else if (line.startsWith('Date:')) {
                    date = line.replace('Date:', '').trim();
                } else if (line.startsWith('Status:')) {
                    status = line.replace('Status:', '').trim();
                }
            });
            
            if (!studentId || !year) {
                errorMsg.textContent = 'Invalid QR code format. Please scan a valid certificate QR code.';
                errorMsg.classList.add('show');
                return;
            }
            
            // Verify certificate via AJAX
            fetch('/VerifyCertificate?student_id=' + encodeURIComponent(studentId) + '&year=' + encodeURIComponent(year))
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        // Display certificate information
                        certDetails.innerHTML = `
                            <p><strong>Student ID:</strong> ${studentId}</p>
                            <p><strong>Student Name:</strong> ${data.student_name || 'N/A'}</p>
                            <p><strong>Course:</strong> ${data.course || 'N/A'}</p>
                            <p><strong>Year:</strong> ${year}</p>
                            <p><strong>Certificate No:</strong> ${certNo}</p>
                            <p><strong>Date of Issue:</strong> ${date}</p>
                            <p><strong>Status:</strong> <span style="color: green; font-weight: bold;">${status}</span></p>
                        `;
                        
                        // Set download link
                        downloadBtn.href = '/DownloadByQR?student_id=' + encodeURIComponent(studentId) + '&year=' + encodeURIComponent(year);
                        downloadBtn.style.display = 'inline-block';
                        
                        certDisplay.classList.add('show');
                        successMsg.textContent = 'Certificate verified successfully!';
                        successMsg.classList.add('show');
                    } else {
                        errorMsg.textContent = data.message || 'Certificate verification failed.';
                        errorMsg.classList.add('show');
                    }
                })
                .catch(error => {
                    errorMsg.textContent = 'Error verifying certificate: ' + error;
                    errorMsg.classList.add('show');
                });
        }
        
        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            stopScan();
        });
    </script>
