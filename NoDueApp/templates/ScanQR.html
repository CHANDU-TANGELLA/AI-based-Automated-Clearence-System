<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Verify Certificate - QR Scan</title>
    <link rel="stylesheet" href="../static/css/bootstrap.min.css">
    <link rel="stylesheet" href="../static/style.css">
    <link rel="stylesheet" href="../static/css/custom.css">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="host_version">

    <header class="top-navbar">
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container-fluid">
                <a class="navbar-brand p-0" href="/">
                    <h1 class="text-white" style="font-size: xx-large;">AI Clearance Verification</h1>
                </a>
            </div>
        </nav>
    </header>

    <div class="container" style="margin-top: 50px;">
        <div class="row">
            <div class="col-md-6 offset-md-3 text-center">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h3><i class="fa fa-qrcode"></i> Scan Certificate QR</h3>
                    </div>
                    <div class="card-body">
                        <div id="reader" style="width: 100%;"></div>
                        <div id="result" class="mt-3"></div>
                        <hr>
                        <h5>Or Upload QR Image</h5>
                        <input type="file" id="qr-input-file" accept="image/*" class="form-control">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function onScanSuccess(decodedText, decodedResult) {
            // Parse text: Expecting format "Student ID: XXX\nYear: YYY"
            // We'll regex search for the ID and Year
            let studentMatch = decodedText.match(/Student ID:\s*(\w+)/);
            let yearMatch = decodedText.match(/Year:\s*(\w+)/);

            if (studentMatch && yearMatch) {
                let sid = studentMatch[1];
                let yr = yearMatch[1];
                
                document.getElementById('result').innerHTML = `<div class="alert alert-info">Verifying...</div>`;
                
                // Call Server
                fetch(`/VerifyCertificate?student_id=${sid}&year=${yr}`)
                .then(response => response.json())
                .then(data => {
                    if(data.success) {
                        document.getElementById('result').innerHTML = `
                            <div class="alert alert-success">
                                <h4><i class="fa fa-check-circle"></i> Valid Certificate</h4>
                                <p><strong>Student:</strong> ${data.student_name}</p>
                                <p><strong>Course:</strong> ${data.course}</p>
                                <p>${data.message}</p>
                            </div>`;
                    } else {
                        document.getElementById('result').innerHTML = `<div class="alert alert-danger"><i class="fa fa-times-circle"></i> ${data.message}</div>`;
                    }
                });
            } else {
                document.getElementById('result').innerHTML = `<div class="alert alert-warning">Invalid QR Format</div>`;
            }
        }

        var html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
        html5QrcodeScanner.render(onScanSuccess);
        
        // File Upload Logic
        const fileinput = document.getElementById('qr-input-file');
        fileinput.addEventListener('change', e => {
            if (e.target.files.length == 0) return;
            const html5QrCode = new Html5Qrcode("reader");
            const imageFile = e.target.files[0];
            html5QrCode.scanFile(imageFile, true)
            .then(decodedText => onScanSuccess(decodedText, null))
            .catch(err => {
                document.getElementById('result').innerHTML = `<div class="alert alert-danger">Could not read QR code from image</div>`;
            });
        });
    </script>
</body>
</html>
