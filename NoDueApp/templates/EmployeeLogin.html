<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Basic -->
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">   
   
    <!-- Mobile Metas -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
 
     <!-- Site Metas -->
    <title>Employee Login - AI-Based Automated Clearance System</title>  
    <meta name="keywords" content="">
    <meta name="description" content="">
    <meta name="author" content="">

    <!-- Icon Font Stylesheet -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>

    <!-- Site Icons -->
    <link rel="shortcut icon" href="../static/images/favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="../static/images/apple-touch-icon.png">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="../static/css/bootstrap.min.css">
    <!-- Site CSS -->
    <link rel="stylesheet" href="../static/style.css">
    <!-- ALL VERSION CSS -->
    <link rel="stylesheet" href="../static/css/versions.css">
    <!-- Responsive CSS -->
    <link rel="stylesheet" href="../static/css/responsive.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../static/css/custom.css?v=1.9">

    <!-- Modernizer for Portfolio -->
    <script src="../static/js/modernizer.js"></script>

    <!--[if lt IE 9]>
      <script src="https://oss.maxcdn.com/libs/html5shiv/3.7.0/html5shiv.js"></script>
      <script src="https://oss.maxcdn.com/libs/respond.js/1.4.2/respond.min.js"></script>
    <![endif]-->

</head>
<body class="host_version"> 

    <!-- LOADER -->
	<div id="preloader">
		<div class="loader-container">
			<div class="progress-br float shadow">
				<div class="progress__item"></div>
			</div>
		</div>
	</div>
	<!-- END LOADER -->	
	
	<!-- Start header -->
	<header class="top-navbar">
		<nav class="navbar navbar-expand-lg navbar-light bg-light">
			<div class="container-fluid">
				<a class="navbar-brand p-0" href="/">
					<h1 class="text-white" style="font-size: xx-large;" ><i class="fa fa-certificate fa-1x me-2"></i> AI<span style="color: #eea412;">Clearance</span></h1>
				</a>                                  
				<button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbars-host" aria-controls="navbars-rs-food" aria-expanded="false" aria-label="Toggle navigation">
					<span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
				</button>
				<div class="collapse navbar-collapse" id="navbars-host">
					<ul class="navbar-nav ml-auto">
						<li class="nav-item active"><a class="nav-link" href="/">Home</a></li>
						<li class="nav-item"><a class="nav-link" href="/AdminLogin.html">Admin Login</a></li>
						<li class="nav-item"><a class="nav-link" href="/EmployeeLogin.html">Department Login</a></li>
						<li class="nav-item"><a class="nav-link" href="/StudentLogin.html">Student Login</a></li>						
					</ul>					
				</div>
			</div>
		</nav>
	</header>
	<!-- End header -->
	
	<div class="login-container">
        <div class="login-form-wrapper">
            <div class="login-form-header">
                <h2><i class="fa fa-user-tie"></i> Department Login</h2>
                <p>Enter your credentials to access the department portal</p>
            </div>
            
            {% if data %}
            <div class="status-message error">
                {{ data|safe }}
            </div>
            {% endif %}
            
            <form id="login-form" action="/EmployeeLoginAction" method="POST" class="login-form">
                {% csrf_token %}
                <div class="form-group">
                    <label for="t1"><i class="fa fa-user"></i> Username</label>  
                    <input type="text" name="t1" id="t1" placeholder="Enter your username" required>  
                </div>
                
                <div class="form-group">
                    <label for="t2"><i class="fa fa-lock"></i> Password</label>  
                    <input type="password" name="t2" id="t2" placeholder="Enter your password" required>
                </div>
                
                <div class="form-group">
                    <label for="t3"><i class="fa fa-building"></i> Department Role</label>
                    <select name="t3" id="t3" required>
                        <option value="">Select Department</option>
                        <option value="Accounts">Accounts</option>
                        <option value="Library">Library</option>
                        <option value="Hostel">Hostel</option>
                        <option value="Exam Fee Dept">Exam Fee Dept</option>
                        <option value="HOD Lab Returns">HOD Lab Returns</option>
                    </select>
                </div>
                
                <button type="submit" class="login-submit-btn">
                    <i class="fa fa-sign-in-alt"></i> Login
                </button>
            </form>
            
            <div class="login-footer">
                <p><a href="/"><i class="fa fa-home"></i> Back to Home</a></p>
            </div>
        </div>
    </div>

    <!-- ALL JS FILES -->
    <script src="../static/js/all.js"></script>
    <!-- ALL PLUGINS -->
    <script src="../static/js/custom.js"></script>
	<script src="../static/js/timeline.min.js"></script>
</body>
</html>
