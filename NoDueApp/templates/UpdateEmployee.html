<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Update Employee - AI Clearance</title>  
    <link rel="stylesheet" href="../static/css/bootstrap.min.css">
    <link rel="stylesheet" href="../static/style.css">
    <link rel="stylesheet" href="../static/css/custom.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="host_version"> 

	<header class="top-navbar">
		<nav class="navbar navbar-expand-lg navbar-light bg-light">
			<div class="container-fluid">
				<a class="navbar-brand p-0" href="/">
					<h1 class="text-white" style="font-size: xx-large;" ><i class="fa fa-certificate fa-1x me-2"></i> AI<span style="color: #eea412;">Clearance</span></h1>
				</a>
                <div class="collapse navbar-collapse">
					<ul class="navbar-nav ml-auto">
						<li class="nav-item">
                            <a class="nav-link" href="/ViewEmployees">
                                <i class="fa fa-arrow-left"></i> Back to Employee List
                            </a>
                        </li>
					</ul>					
				</div>
			</div>
		</nav>
	</header>
	
	<div class="dashboard-container" style="padding: 40px;">
        <div class="row">
            <div class="col-md-6 offset-md-3">
                <div class="card shadow" style="border: none; border-radius: 10px; overflow: hidden;">
                    <div class="card-header text-white" style="background-color: #eea412; padding: 15px;">
                        <h3 class="card-title mb-0"><i class="fa fa-edit"></i> Update Employee Details</h3>
                    </div>
                    <div class="card-body" style="background: #fff; padding: 30px;">
                        
                        <form action="/UpdateEmployeeAction" method="post">
                            {% csrf_token %}
                            
                            <input type="hidden" name="old_username" value="{{ employee.7 }}">

                            <div class="form-group mb-3">
                                <label style="font-weight: bold;">Employee Name</label>
                                <input type="text" name="t1" class="form-control" value="{{ employee.0 }}" required>
                            </div>

                            <div class="form-group mb-3">
                                <label style="font-weight: bold;">Gender</label>
                                <select name="t2" class="form-control" required>
                                    <option value="{{ employee.1 }}" selected>{{ employee.1 }}</option>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                </select>
                            </div>

                            <div class="form-group mb-3">
                                <label style="font-weight: bold;">Contact No</label>
                                <input type="text" name="t3" class="form-control" value="{{ employee.2 }}" required>
                            </div>

                            <div class="form-group mb-3">
                                <label style="font-weight: bold;">Email</label>
                                <input type="email" name="t4" class="form-control" value="{{ employee.3 }}" required>
                            </div>

                            <div class="form-group mb-3">
                                <label style="font-weight: bold;">Qualification</label>
                                <input type="text" name="t5" class="form-control" value="{{ employee.4 }}" required>
                            </div>

                            <div class="form-group mb-3">
                                <label style="font-weight: bold;">Experience</label>
                                <input type="text" name="t6" class="form-control" value="{{ employee.5 }}" required>
                            </div>

                            <div class="form-group mb-3">
                                <label style="font-weight: bold;">Department Role</label>
                                <select name="t7" class="form-control" required>
                                    <option value="{{ employee.6 }}" selected>{{ employee.6 }}</option>
                                    <option value="Accounts">Accounts</option>
                                    <option value="Library">Library</option>
                                    <option value="Hostel">Hostel</option>
                                    <option value="Exam Fee Dept">Exam Fee Dept</option>
                                    <option value="HOD Lab Returns">HOD Lab Returns</option>
                                    <option value="Admin">Admin</option>
                                </select>
                            </div>

                            <div class="form-group mb-3">
                                <label style="font-weight: bold;">Username</label>
                                <input type="text" name="t8" class="form-control" value="{{ employee.7 }}" required>
                            </div>

                            <div class="form-group mb-3">
                                <label style="font-weight: bold;">Password</label>
                                <input type="text" name="t9" class="form-control" value="{{ employee.8 }}" required>
                            </div>

                            <button type="submit" class="btn btn-warning w-100 text-white" style="font-weight: bold; padding: 10px;">
                                <i class="fa fa-save"></i> Save Changes
                            </button>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="../static/js/all.js"></script>
</body>
</html>
