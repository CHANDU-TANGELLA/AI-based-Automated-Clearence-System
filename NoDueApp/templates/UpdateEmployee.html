			<div class="progress-br float shadow">

		</div>

	<!-- Start header -->
	<header class="top-navbar">
		<nav class="navbar navbar-expand-lg navbar-light bg-light">
			<div class="container-fluid">
				<a class="navbar-brand p-0" href="/">
					<h1 class="text-white" style="font-size: xx-large;" ><i class="fa fa-certificate fa-1x me-2"></i> AI<span style="color: #eea412;">Clearance</span></h1>
				</a>                                  
				<button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbars-host" aria-controls="navbars-rs-food" aria-expanded="false" aria-label="Toggle navigation">

					</ul>					
				</div>
			</div>
		</nav>
	</header>
	<!-- End header -->
	
	<div class="form-container">
        <h2><i class="fa fa-user-edit"></i> Update Employee</h2>
        
        {% if data %}
        <div class="status-message {% if 'added' in data|lower or 'success' in data|lower %}success{% else %}error{% endif %}">
            {{ data|safe }}
        </div>
        {% endif %}

        {% if employee %}
        <form action="/UpdateEmployeeAction" method="POST">
            {% csrf_token %}
            <input type="hidden" name="old_username" value="{{ employee.7 }}">
            <div class="form-grid">
                <div class="form-group">
                    <label for="t1"><i class="fa fa-user"></i> Employee Name</label>
                    <input type="text" name="t1" id="t1" placeholder="Enter employee full name" value="{{ employee.0 }}" required>
                </div>
                <div class="form-group">
                    <label for="t2"><i class="fa fa-venus-mars"></i> Gender</label>
                    <select name="t2" id="t2" required>
                        <option value="">Select Gender</option>
                        <option value="Male" {% if employee.1 == "Male" %}selected{% endif %}>Male</option>
                        <option value="Female" {% if employee.1 == "Female" %}selected{% endif %}>Female</option>
                        <option value="Other" {% if employee.1 == "Other" %}selected{% endif %}>Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="t3"><i class="fa fa-phone"></i> Contact Number</label>
                    <input type="text" name="t3" id="t3" placeholder="Enter contact number" value="{{ employee.2 }}" required>
                </div>
                <div class="form-group">
                    <label for="t4"><i class="fa fa-envelope"></i> Email ID</label>
                    <input type="email" name="t4" id="t4" placeholder="Enter email address" value="{{ employee.3 }}" required>
                </div>
                <div class="form-group">
                    <label for="t5"><i class="fa fa-graduation-cap"></i> Qualification</label>
                    <input type="text" name="t5" id="t5" placeholder="Enter qualification" value="{{ employee.4 }}" required>
                </div>
                <div class="form-group">
                    <label for="t6"><i class="fa fa-briefcase"></i> Experience</label>
                    <input type="text" name="t6" id="t6" placeholder="Enter years of experience" value="{{ employee.5 }}" required>
                </div>
                <div class="form-group">
                    <label for="t7"><i class="fa fa-building"></i> Department Role</label>
                    <select name="t7" id="t7" required>
                        <option value="">Select Department</option>
                        <option value="Accounts" {% if employee.6 == "Accounts" %}selected{% endif %}>Accounts</option>
                        <option value="Library" {% if employee.6 == "Library" %}selected{% endif %}>Library</option>
                        <option value="Hostel" {% if employee.6 == "Hostel" %}selected{% endif %}>Hostel</option>
                        <option value="Exam Fee Dept" {% if employee.6 == "Exam Fee Dept" %}selected{% endif %}>Exam Fee Dept</option>
                        <option value="HOD Lab Returns" {% if employee.6 == "HOD Lab Returns" %}selected{% endif %}>HOD Lab Returns</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="t8"><i class="fa fa-user-circle"></i> Username</label>
                    <input type="text" name="t8" id="t8" placeholder="Enter username" value="{{ employee.7 }}" required>
                </div>
                <div class="form-group full-width">
                    <label for="t9"><i class="fa fa-lock"></i> Password</label>
                    <input type="password" name="t9" id="t9" placeholder="Enter password" value="{{ employee.8 }}" required>
                </div>
            </div>
            <button type="submit" class="form-submit-btn">
                <i class="fa fa-save"></i> Update Employee
            </button>
        </form>
        {% endif %}
    </div>
